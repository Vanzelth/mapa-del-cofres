<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa del Cofre</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🗺️ Mapa del Cofre</h1>

        <div class="timer-box">

            <h2>Siguiente Cofre</h2>

            <div id="countdown">
                00:00:00
            </div>

            <div class="progress">

                <div id="progress-bar"></div>

            </div>

        </div>

        <div class="countries">

            <h2>🌎 Próximo horario</h2>

            <table id="countryTable">

            </table>

        </div>

        <div class="next-spawns">

            <h2>📅 Próximos Cofres</h2>

            <ul id="spawnList">

            </ul>

        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
